[package]
name = "prognost"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Read a code change's prognosis before it ships: like terraform plan, for code — what a diff touches, how far it reaches through its callers, and what in that reach looks risky"
license = "MIT OR Apache-2.0"
repository = "https://github.com/azihsoyn/prognost"
homepage = "https://github.com/azihsoyn/prognost"
readme = "README.md"
keywords = ["code-review", "call-graph", "diff", "typescript", "tui"]
categories = ["command-line-utilities", "development-tools"]
# The README's images and the demo stay in the repository, not the crate.
exclude = ["docs/demo/*.gif", "docs/demo/*.png", "assets/*.svg"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
ratatui = "0.30.2"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
glob = "0.3.2"
regex = "1.11"
tree-sitter = "0.27"
tree-sitter-typescript = "0.23"
similar = "2.7"
toml = "0.8"
tiny_http = "0.12"
diffseen = "0.1.0"

[dev-dependencies]
tempfile = "3.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
