  <text class="call" x="66.0" y="66.6">╲</text>
  <text class="call" x="90.0" y="66.6">╱</text>
  <text class="call" x="114.0" y="66.6">╲</text>
  <text class="word" x="234.0 246.0 258.0 270.0 282.0 294.0 306.0" y="66.6">├─┘├┬┘│</text>
  <text class="word" x="330.0 342.0" y="66.6">││</text>
  <text class="word" x="366.0 378.0 390.0 402.0 414.0" y="66.6">┬││││</text>
  <text class="word" x="438.0 450.0 462.0 474.0" y="66.6">│└─┐</text>
  <text class="word" x="498.0" y="66.6">│</text>
  <text class="call" x="78.0" y="90.0">●</text>
  <text class="call" x="126.0" y="90.0">●</text>
  <text class="word" x="234.0" y="90.0">┴</text>
  <text class="word" x="270.0 282.0 294.0 306.0 318.0 330.0 342.0 354.0 366.0 378.0 390.0 402.0 414.0 426.0 438.0 450.0 462.0 474.0" y="90.0">┴└─└─┘└─┘┘└┘└─┘└─┘</text>
  <text class="word" x="498.0" y="90.0">┴</text>
