<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="prognost: a change at the bottom, its callers lit up above it">
  <defs>
    <radialGradient id="film" cx="50%" cy="78%" r="85%">
      <stop offset="0" stop-color="#123447"/>
      <stop offset="1" stop-color="#07131b"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- the film -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#film)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="51.25" fill="none" stroke="#2a5466" stroke-width="1.5"/>

  <!-- rings of reach around the change -->
  <g fill="none" stroke="#6fe3f2" stroke-linecap="round">
    <path d="M86 196 a42 42 0 0 1 84 0" stroke-opacity=".22" stroke-width="2"/>
    <path d="M60 196 a68 68 0 0 1 136 0" stroke-opacity=".12" stroke-width="2"/>
  </g>

  <!-- code nothing reaches: dim -->
  <g stroke="#3d6070" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M208 70 L208 124"/>
  </g>
  <circle cx="208" cy="70" r="10" fill="#0b1d27" stroke="#3d6070" stroke-width="3"/>
  <circle cx="208" cy="124" r="8" fill="#0b1d27" stroke="#3d6070" stroke-width="3"/>

  <!-- calls from the change up to the entry points -->
  <g stroke="#6fe3f2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M128 192 C128 168 92 160 88 136"/>
    <path d="M128 192 C128 168 160 160 164 136"/>
    <path d="M88 136 C86 112 58 102 56 76"/>
    <path d="M88 136 C90 112 124 102 128 76"/>
    <path d="M164 136 C162 112 132 102 128 76"/>
  </g>
  <g fill="#0b1d27" stroke="#6fe3f2" stroke-width="4.5" filter="url(#soft)">
    <circle cx="88" cy="136" r="10"/>
    <circle cx="164" cy="136" r="10"/>
    <circle cx="56" cy="72" r="12"/>
    <circle cx="128" cy="72" r="12"/>
  </g>
  <!-- entry points: a bright core -->
  <circle cx="56" cy="72" r="4.5" fill="#bff6fc"/>
  <circle cx="128" cy="72" r="4.5" fill="#bff6fc"/>

  <!-- the change -->
  <circle cx="128" cy="196" r="17" fill="#ffb547" filter="url(#glow)"/>
  <circle cx="128" cy="196" r="7" fill="#fff2d6"/>
</svg>
