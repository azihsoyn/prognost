<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 173" width="612" height="173" role="img" aria-label="prognost — a prognosis for a code change. A change at the bottom, the calls up to it lit above.">
  <style>
    text { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 20px; white-space: pre; }
    .call { fill: #6fe3f2; }
    .idle { fill: #47606c; }
    .change { fill: #ffb547; }
    .word { fill: #e8eef2; }
    .tag { fill: #8fa3ad; font-size: 16px; }
  </style>
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="610" height="171" rx="14" fill="#0e1a22" stroke="#24404d" stroke-width="2"/>
  <text class="call" x="54.0" y="43.2">●</text>
